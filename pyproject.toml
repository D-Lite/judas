[project]
name = "alertcheck"
version = "0.1.0"
description = "Merchant payment verification assistant prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "itsdangerous>=2.2,<3",
  "bcrypt>=4.2,<5",
  "mcp>=1.13,<2",
  "pypdf>=5,<7",
  "pillow>=11,<13",
  "pytesseract>=0.3.13,<1",
  "reportlab>=4.2,<5",
  "httpx>=0.27,<1",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
